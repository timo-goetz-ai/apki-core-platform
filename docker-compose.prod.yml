version: '3.8'
# ─────────────────────────────────────────────────────────────────────────────
# AIOS – Production Stack (Coolify / Hetzner)
# Images kommen von ghcr.io/timogoetz1988/ (via GitHub Actions gebaut)
# Kein Hot-Reload, keine lokalen Volume-Mounts, Worker-Mode
# ─────────────────────────────────────────────────────────────────────────────

services:

  nexus-core:
    image: ghcr.io/timogoetz1988/nexus-core:latest
    container_name: aios-nexus-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aios_user:${DB_PASSWORD}@aios-db:5432/aios_db
      - REDIS_URL=redis://aios-redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - BROWSERLESS_URL=http://aios-browserless:3000
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN}
      - N8N_BASE_URL=${N8N_BASE_URL:-https://n8n.automation-plus-ki.de}
    networks:
      - frontend-net   # admin-dashboard → nexus-core
      - data-net       # nexus-core → db, redis, browserless
    depends_on:
      - aios-db
      - aios-redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin-dashboard:
    image: ghcr.io/timogoetz1988/aios-admin-dashboard:latest
    container_name: aios-admin-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_NEXUS_API_URL=https://api.aios.automation-plus-ki.de
      - NEXT_PUBLIC_WS_URL=wss://api.aios.automation-plus-ki.de
    networks:
      - frontend-net   # only nexus-core visible, not db/redis
    depends_on:
      - nexus-core
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aios-db:
    image: postgres:15-alpine
    container_name: aios-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aios_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aios_db
    volumes:
      - aios-db-data:/var/lib/postgresql/data
    networks:
      - data-net       # only nexus-core can reach this

  aios-redis:
    image: redis:7-alpine
    container_name: aios-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - aios-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - data-net       # only nexus-core can reach this

  aios-browserless:
    image: browserless/chrome:latest
    container_name: aios-browserless
    restart: unless-stopped
    environment:
      - CONNECTION_TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=5
      - TOKEN=${BROWSERLESS_TOKEN}
    networks:
      - data-net       # only nexus-core can reach this
    shm_size: 1gb

networks:
  # admin-dashboard can only reach nexus-core, not data services
  frontend-net:
    driver: bridge
    internal: false
  # db, redis, browserless: only reachable from nexus-core, no direct internet
  data-net:
    driver: bridge
    internal: true

volumes:
  aios-db-data:
  aios-redis-data:
