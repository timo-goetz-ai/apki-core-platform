services:

  nexus-core:
    build:
      context: ./services/nexus-core
      dockerfile: Dockerfile
    container_name: aios-nexus-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    environment:
      - DATABASE_URL=postgresql+asyncpg://aios_user:${DB_PASSWORD:-aios_pass}@aios-db:5432/aios_db
      - REDIS_URL=redis://aios-redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - BROWSERLESS_URL=http://aios-browserless:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret_min_32_chars_abc}
      - LOG_LEVEL=DEBUG
    volumes:
      - ./services/nexus-core:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend-net   # admin-dashboard → nexus-core
      - workers-net    # crew-api → nexus-core
      - data-net       # nexus-core → db, redis, browserless
      - monitoring-net # prometheus scraping
    depends_on:
      aios-db:
        condition: service_healthy
      aios-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile
    container_name: aios-admin-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_NEXUS_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    networks:
      - frontend-net   # only nexus-core visible, not db/redis
    depends_on:
      - nexus-core

  crew-api:
    build:
      context: ./services/crew-api
      dockerfile: Dockerfile
    container_name: aios-crew-api
    restart: unless-stopped
    ports:
      - "8002:8002"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NEXUS_CORE_URL=http://nexus-core:8000
      - LOG_LEVEL=debug
    networks:
      - workers-net    # only nexus-core visible, not db/redis
    depends_on:
      - nexus-core

  aios-db:
    image: postgres:15-alpine
    container_name: aios-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"  # dev only: bind to localhost, not 0.0.0.0
    environment:
      - POSTGRES_USER=aios_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-aios_pass}
      - POSTGRES_DB=aios_db
    volumes:
      - aios-db-data:/var/lib/postgresql/data
    networks:
      - data-net       # only nexus-core can reach this
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios_user -d aios_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  aios-redis:
    image: redis:7-alpine
    container_name: aios-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"  # dev only: bind to localhost, not 0.0.0.0
    volumes:
      - aios-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - data-net       # only nexus-core can reach this
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  aios-browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: aios-browserless
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"  # dev only: localhost only
    environment:
      - CONNECTION_TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=5
      - TOKEN=${BROWSERLESS_TOKEN:-local-dev-token}
    networks:
      - data-net       # only nexus-core can reach this
    shm_size: 1gb

  aios-loki:
    image: grafana/loki:2.9.0
    container_name: aios-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: aios-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: aios-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring-net

networks:
  # admin-dashboard and crew-api can only reach nexus-core, not data services
  frontend-net:
    driver: bridge
    internal: false
  workers-net:
    driver: bridge
    internal: false
  # db, redis, browserless: only reachable from nexus-core
  data-net:
    driver: bridge
    internal: true   # no direct internet access from data services
  # prometheus/grafana/loki: scraping and dashboards
  monitoring-net:
    driver: bridge
    internal: false

volumes:
  aios-db-data:
  aios-redis-data:
  loki-data:
  prometheus-data:
  grafana-data:
