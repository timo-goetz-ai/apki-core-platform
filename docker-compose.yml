services:

  nexus-core:
    build:
      context: ./services/nexus-core
      dockerfile: Dockerfile
    container_name: aios-nexus-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    environment:
      - DATABASE_URL=postgresql+asyncpg://aios_user:${DB_PASSWORD:-aios_pass}@aios-db:5432/aios_db
      - REDIS_URL=redis://aios-redis:6379/0
      - ANYTHINGLLM_URL=${ANYTHINGLLM_URL:-http://anythingllm:3001}
      - ANYTHINGLLM_API_KEY=${ANYTHINGLLM_API_KEY:-}
      - ANYTHINGLLM_WORKSPACE=${ANYTHINGLLM_WORKSPACE:-aios}
      - BROWSERLESS_URL=http://aios-browserless:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret_min_32_chars_abc}
      - LOG_LEVEL=DEBUG
    volumes:
      - ./services/nexus-core:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend-net   # admin-dashboard → nexus-core
      - workers-net    # crew-api → nexus-core
      - data-net       # nexus-core → db, redis, browserless
      - monitoring-net # prometheus scraping
    depends_on:
      aios-db:
        condition: service_healthy
      aios-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile
    container_name: aios-admin-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Für lokale Entwicklung: npm run dev nutzen statt Docker (Hot Reload)
      # Für Docker-Build: nexus-core ist der Service-Name im Container-Netz
      - NEXT_PUBLIC_AIOS_CORE_API_URL=http://nexus-core:8000
      - NEXT_PUBLIC_WS_URL=ws://nexus-core:8000
    networks:
      - frontend-net   # only nexus-core visible, not db/redis
    depends_on:
      - nexus-core

  crew-api:
    build:
      context: ./services/crew-api
      dockerfile: Dockerfile
    container_name: aios-crew-api
    restart: unless-stopped
    ports:
      - "8002:8002"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    environment:
      - ANYTHINGLLM_URL=${ANYTHINGLLM_URL:-http://anythingllm:3001}
      - ANYTHINGLLM_API_KEY=${ANYTHINGLLM_API_KEY:-}
      - ANYTHINGLLM_WORKSPACE=${ANYTHINGLLM_WORKSPACE:-aios}
      - AIOS_CORE_URL=http://nexus-core:8000
      - LOG_LEVEL=debug
    networks:
      - workers-net    # only nexus-core visible, not db/redis
    depends_on:
      - nexus-core

  aios-db:
    image: postgres:15-alpine
    container_name: aios-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"  # dev only: bind to localhost, not 0.0.0.0
    environment:
      - POSTGRES_USER=aios_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-aios_pass}
      - POSTGRES_DB=aios_db
    volumes:
      - aios-db-data:/var/lib/postgresql/data
    networks:
      - data-net       # only nexus-core can reach this
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios_user -d aios_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  aios-redis:
    image: redis:7-alpine
    container_name: aios-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"  # dev only: bind to localhost, not 0.0.0.0
    volumes:
      - aios-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - data-net       # only nexus-core can reach this
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  aios-browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: aios-browserless
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"  # dev only: localhost only
    environment:
      - CONNECTION_TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=5
      - TOKEN=${BROWSERLESS_TOKEN:-local-dev-token}
    networks:
      - data-net       # only nexus-core can reach this
    shm_size: 1gb

  aios-loki:
    image: grafana/loki:2.9.0
    container_name: aios-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: aios-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: aios-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring-net

  # ── Staging-only: lokales n8n (docker compose --profile staging up) ─────
  n8n-staging:
    profiles: ["staging"]
    image: n8nio/n8n:latest
    container_name: aios-n8n-staging
    restart: unless-stopped
    ports:
      - "5679:5678"   # 5679 lokal um nicht mit prod-Port zu kollidieren
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-staging-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_STAGING_DB_PASSWORD:-n8n_staging_pass}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_METRICS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
    volumes:
      - n8n-staging-data:/home/node/.n8n
    depends_on:
      n8n-staging-db:
        condition: service_healthy
    networks:
      - monitoring-net
      - data-net

  n8n-staging-db:
    profiles: ["staging"]
    image: postgres:15-alpine
    container_name: aios-n8n-staging-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_STAGING_DB_PASSWORD:-n8n_staging_pass}
      - POSTGRES_DB=n8n
    volumes:
      - n8n-staging-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-net

  # ── Browser Use 2.0 — KI-gesteuerter Browser für Research/Scraping ────────
  browser-use:
    profiles: ["staging"]
    build:
      context: ./services/browser-use
      dockerfile: Dockerfile
    container_name: aios-browser-use
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - LLM_PROVIDER=${BROWSER_USE_LLM_PROVIDER:-anythingllm}
      - ANYTHINGLLM_URL=http://anythingllm:3001
      - ANYTHINGLLM_API_KEY=${ANYTHINGLLM_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    shm_size: 1gb   # Chromium braucht shared memory
    networks:
      - frontend-net   # n8n + admin-dashboard können zugreifen
      - workers-net    # nexus-core kann zugreifen
    depends_on:
      - anythingllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── AnythingLLM — lokales LLM-Hub (kostenlos, ersetzt OpenRouter) ────────
  anythingllm:
    profiles: ["staging"]
    image: mintplexlabs/anythingllm:latest
    container_name: aios-anythingllm
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "3003:3001"   # 3003 lokal (3001 = browserless)
    environment:
      - STORAGE_DIR=/app/server/storage
      - UID=1000
      - GID=1000
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret_min_32_chars_abc}
    volumes:
      # Vorhandene Workspaces & Daten aus Mac-Installation einbinden
      - /Users/zuhause_mit_ideen/Library/Application Support/anythingllm-desktop/storage:/app/server/storage
    networks:
      - frontend-net   # admin-dashboard + n8n-staging können zugreifen
      - workers-net    # crew-api + nexus-core können zugreifen

networks:
  # admin-dashboard and crew-api can only reach nexus-core, not data services
  frontend-net:
    driver: bridge
    internal: false
  workers-net:
    driver: bridge
    internal: false
  # db, redis, browserless: only reachable from nexus-core
  data-net:
    driver: bridge
    internal: true   # no direct internet access from data services
  # prometheus/grafana/loki: scraping and dashboards
  monitoring-net:
    driver: bridge
    internal: false

volumes:
  aios-db-data:
  aios-redis-data:
  loki-data:
  prometheus-data:
  grafana-data:
  n8n-staging-data:
  n8n-staging-db-data:
