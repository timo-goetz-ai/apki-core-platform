# KI-Bewerbungs-Automation: N8n + NocoDB Stack
# Deployment: ssh hetzner "cd /path/to/docker && docker compose up -d"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-bewerbung
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - nocodb
    networks:
      - bewerbung-net

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb-bewerbung
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NC_DB=sqlite3
      - NC_DB_URL=file:/usr/app/data/nocodb.sqlite
      - NC_AUTH_JWT_SECRET=${NC_AUTH_JWT_SECRET}
      - NC_PUBLIC_URL=${NC_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - nocodb_data:/usr/app/data
    networks:
      - bewerbung-net

volumes:
  n8n_data:
  nocodb_data:

networks:
  bewerbung-net:
    driver: bridge
