crews:

  # ── Content Generation Crew ──────────────────────────────────────────────────
  # Triggern via POST /crews/content_generation_crew/start
  # Inputs: topic, category, target_platforms, pipeline_job_id (optional)
  content_generation_crew:
    name: "Content Generation Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: researcher
        role: "Content Research Specialist"
        goal: >
          Analysiere das gegebene Thema gründlich. Identifiziere die wichtigsten
          Aspekte, aktuelle Relevanz, häufige Fragen und wertvolle Insights.
          Liefere strukturierte Recherche-Ergebnisse als Grundlage für
          hochwertigen Content.
        backstory: >
          Du bist ein erfahrener Content-Researcher mit Expertise in KI,
          Technologie und digitalem Marketing. Du weißt wie man komplexe Themen
          aufschlüsselt, die Pain Points der Zielgruppe identifiziert und
          relevante Informationen klar strukturiert. Du schreibst auf Deutsch
          und kennst den deutschsprachigen KI-Markt sehr gut.
        mcp_servers: []

      - id: writer
        role: "Content Writer & SEO Specialist"
        goal: >
          Schreibe auf Basis der Recherche einen hochwertigen, engagierenden
          Artikel. Der Content soll informativ, gut strukturiert und für die
          Zielplattformen optimiert sein. Integriere SEO-Keywords natürlich.
        backstory: >
          Du bist ein professioneller deutschsprachiger Content Writer
          spezialisiert auf KI und Technologie. Deine Texte sind klar, präzise
          und fesselnd. Du weißt wie man für verschiedene Plattformen (Blog,
          LinkedIn, Instagram) schreibt und dabei sowohl Leser als auch
          Suchmaschinen ansprichst. Du lieferst immer valides JSON als Output.
        mcp_servers: []

    tasks:
      - id: research
        agent_id: researcher
        description: >
          Recherchiere das Thema "{topic}" für die Kategorie "{category}".

          Analysiere:
          1. Was ist das Kernthema und warum ist es gerade relevant?
          2. Welche Aspekte sind für die Zielgruppe (deutschspr. KI-Interessierte) am wichtigsten?
          3. Welche häufigen Fragen oder Missverständnisse gibt es zu diesem Thema?
          4. Was sind die 3-5 wichtigsten Punkte die der Leser mitnehmen soll?
          5. Welche SEO-Keywords eignen sich (5-8 Stück, deutsch)?

          Zielplattformen: {target_platforms}
        expected_output: >
          Ein strukturierter Recherche-Report mit:
          - Executive Summary (2-3 Sätze)
          - 3-5 Kernpunkte mit kurzen Erklärungen
          - 5-8 SEO-Keywords (kommasepariert)
          - Empfohlene Artikel-Struktur (Überschriften-Vorschlag H1/H2)

      - id: write
        agent_id: writer
        description: >
          Schreibe einen vollständigen deutschen Artikel zum Thema "{topic}"
          auf Basis des Recherche-Reports.

          Anforderungen:
          - Länge: 600-900 Wörter
          - Sprache: Deutsch, professionell aber zugänglich
          - Ton: Direkt, praxisorientiert, kein Buzzword-Bingo
          - Struktur: Einleitung → Hauptteil (3-4 Abschnitte mit H2) → Fazit
          - SEO: Keywords aus dem Recherche-Report natürlich einbauen
          - Kategorie: {category}
          - Zielplattformen: {target_platforms}

          Liefere das Ergebnis als JSON-Objekt (kein Markdown drumherum):
          {{
            "title": "SEO-optimierter Titel (max. 60 Zeichen)",
            "excerpt": "Meta-Description (max. 160 Zeichen)",
            "seo_keywords": "keyword1, keyword2, keyword3",
            "content": "Vollständiger Artikel in Markdown"
          }}
        expected_output: >
          Valides JSON-Objekt mit den Feldern title, excerpt, seo_keywords
          und content (Markdown-Artikel, 600-900 Wörter, auf Deutsch).
        context_task_ids:
          - research

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Niche Analysis Crew ───────────────────────────────────────────────────────
  # Inputs: topic, opportunity_summary, platform
  niche_analysis_crew:
    name: "Niche Analysis Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: audience_analyst
        role: "Audience & Niche Research Specialist"
        goal: >
          Analysiere Zielgruppen und Nischen präzise. Identifiziere
          demografische Merkmale, Pain Points, Informationsbedürfnisse
          und die besten Kanäle um sie zu erreichen.
        backstory: >
          Du bist ein erfahrener Marketing-Analyst mit Fokus auf
          deutschsprachige KI- und Tech-Zielgruppen. Du kennst die
          Unterschiede zwischen LinkedIn-Profis, Instagram-Followern und
          Blog-Lesern und weißt welche Inhalte auf welcher Plattform
          funktionieren.
        mcp_servers: []

      - id: opportunity_scorer
        role: "Content Opportunity Evaluator"
        goal: >
          Bewerte Content-Chancen nach Potenzial, Wettbewerb und
          strategischem Fit. Priorisiere Themen die maximale Reichweite
          bei minimalem Wettbewerb bieten.
        backstory: >
          Du bist ein strategischer Content-Planer der datenbasiert
          Prioritäten setzt. Du verstehst SEO-Grundlagen, Social Media
          Algorithmen und weißt was in der DACH-Region im KI-Bereich
          aktuell gefragt ist.
        mcp_servers: []

    tasks:
      - id: audience_analysis
        agent_id: audience_analyst
        description: >
          Analysiere die Zielgruppe für das Thema "{topic}" auf der
          Plattform "{platform}".

          Liefere:
          1. Primäre Zielgruppe (Alter, Beruf, Interessen, Wissenslevel)
          2. Sekundäre Zielgruppe
          3. Top 3 Pain Points dieser Zielgruppe bezüglich des Themas
          4. Was motiviert sie, diesen Content zu konsumieren?
          5. Empfohlener Ton und Kommunikationsstil
          6. Optimale Contentlänge und -format für die Plattform
        expected_output: >
          Strukturierter Audience-Report mit Primär-/Sekundärzielgruppe,
          Pain Points, Motivationen und Kommunikationsempfehlungen.

      - id: opportunity_scoring
        agent_id: opportunity_scorer
        description: >
          Bewerte die Content-Chance "{topic}" basierend auf der
          Audience-Analyse.

          Kontext: {opportunity_summary}

          Bewerte (Skala 1-10):
          - Zielgruppen-Relevanz
          - Wettbewerbssituation (10 = kaum Wettbewerb)
          - Virales Potenzial
          - SEO-Potenzial
          - Evergreen-Faktor (Langlebigkeit)

          Empfehle: Sofort produzieren / In 2 Wochen / Später / Skip
          Begründung und optimaler Veröffentlichungszeitpunkt.
        expected_output: >
          Scoring-Matrix mit 5 Dimensionen (je 1-10), Gesamtscore,
          klare Empfehlung (Produce Now/Later/Skip) und Timing-Hinweis.
        context_task_ids:
          - audience_analysis

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Content Forecast Crew ─────────────────────────────────────────────────────
  # Inputs: trends_summary, sentiment_summary, top_opportunities
  content_forecast_crew:
    name: "Content Forecast Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: trend_analyst
        role: "Trend Intelligence Analyst"
        goal: >
          Analysiere aktuelle Trends und Sentiments im KI-Bereich.
          Erkenne Muster, Korrelationen und aufkommende Themen bevor
          sie Mainstream werden.
        backstory: >
          Du bist ein Trend-Analyst der täglich Hunderte von Signalen
          aus dem deutschsprachigen Tech-Raum auswertet. Du erkennst
          früh welche Themen viral gehen und hast ein Gespür für den
          Zeitgeist der DACH-KI-Community.
        mcp_servers: []

      - id: content_strategist
        role: "Content Strategy Planner"
        goal: >
          Entwickle einen datenbasierten Content-Plan für die nächsten
          2 Wochen. Empfehle konkrete Themen, Formate und Zeitpunkte
          für maximale Reichweite und Engagement.
        backstory: >
          Du bist ein erfahrener Content-Stratege der aus Rohdaten
          umsetzbare Redaktionspläne macht. Du denkst in Kampagnen,
          verstehst Content-Kalender und weißt wie man Themen
          sequenziell aufbaut um eine Audience langfristig zu binden.
        mcp_servers: []

    tasks:
      - id: trend_interpretation
        agent_id: trend_analyst
        description: >
          Analysiere die folgenden Trend- und Sentiment-Daten aus den
          letzten 30 Tagen:

          TRENDS:
          {trends_summary}

          SENTIMENT:
          {sentiment_summary}

          TOP OPPORTUNITIES:
          {top_opportunities}

          Identifiziere:
          1. Die 3 stärksten aufsteigenden Trends
          2. Themen die gerade ihren Peak haben (jetzt produzieren!)
          3. Themen die nachlassen (vermeiden)
          4. Überraschende Entwicklungen die besondere Chancen bieten
          5. Stimmungslage der Community (optimistisch/skeptisch/neugierig)
        expected_output: >
          Trend-Analyse-Report: Top-Trends, Peak-Themen, nachlassende
          Themen, Überraschungen und Community-Stimmung mit Begründungen.

      - id: content_calendar
        agent_id: content_strategist
        description: >
          Erstelle einen Content-Kalender für die nächsten 14 Tage
          basierend auf der Trend-Analyse.

          Erstelle JSON-Array mit 7 empfohlenen Content-Pieces:
          [
            {{
              "topic": "Konkretes Thema",
              "category": "KI-Tools|Tutorial|Review|News|Allgemein",
              "publish_date": "YYYY-MM-DD",
              "target_platforms": "blog,linkedin",
              "priority": "high|medium|low",
              "reasoning": "Warum jetzt?"
            }}
          ]

          Variiere Kategorien und Plattformen. Verteile Inhalte sinnvoll
          über die 2 Wochen. Starte mit den stärksten Trend-Themen.
        expected_output: >
          JSON-Array mit 7 Content-Piece-Empfehlungen inkl. Datum,
          Kategorie, Plattform, Priorität und Begründung.
        context_task_ids:
          - trend_interpretation

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Deep Research Crew ────────────────────────────────────────────────────────
  # Inputs: topic, category, context
  deep_research_crew:
    name: "Deep Research Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: researcher
        role: "Senior Research Analyst"
        goal: >
          Recherchiere Themen tief und umfassend. Sammle Fakten,
          Statistiken, Expertenmeinungen und Gegenargumente.
          Bewerte Informationsqualität kritisch.
        backstory: >
          Du bist ein Senior-Analyst mit wissenschaftlichem Hintergrund
          und jahrelanger Erfahrung in KI-Technologie-Recherche.
          Du unterscheidest Fakten von Meinungen, kennst die wichtigsten
          Quellen und Experten im DACH-KI-Raum und weißt wie man
          komplexe Sachverhalte verständlich aufbereitet.
        mcp_servers: []

      - id: synthesizer
        role: "Research Synthesis Specialist"
        goal: >
          Synthetisiere komplexe Recherche-Ergebnisse zu klaren,
          umsetzbaren Briefings. Ziehe Schlussfolgerungen, erkenne
          Implikationen und formuliere konkrete Handlungsempfehlungen.
        backstory: >
          Du bist ein Experte für Knowledge Synthesis. Du nimmst
          komplexe Rohinformationen und destillierst sie zu prägnanten,
          wertvollen Briefings die Content-Teams direkt nutzen können.
          Du erkennst Muster, formulierst klare Thesen und scheust dich
          nicht vor klaren Meinungen wo die Datenlage es hergibt.
        mcp_servers: []

    tasks:
      - id: deep_research
        agent_id: researcher
        description: >
          Führe eine tiefe Recherche zum Thema "{topic}" durch
          (Kategorie: {category}).

          Zusätzlicher Kontext: {context}

          Recherchiere:
          1. Kernfakten und aktuelle Entwicklungen (2024-2026)
          2. Wichtige Statistiken und Zahlen
          3. Pro-Argumente / Chancen
          4. Contra-Argumente / Risiken und Kritik
          5. Expertenmeinungen (wer sagt was?)
          6. Praktische Anwendungsbeispiele
          7. Was kommt als nächstes? (Ausblick)
        expected_output: >
          Umfassender Research-Report mit Fakten, Statistiken,
          Pro/Contra-Argumente, Expertenmeinungen, Beispiele und Ausblick.

      - id: synthesis_briefing
        agent_id: synthesizer
        description: >
          Erstelle ein Redaktions-Briefing basierend auf dem Research-Report.

          Das Briefing soll Content-Erstellern ermöglichen ohne weitere
          Recherche sofort loszuschreiben.

          Liefere JSON:
          {{
            "executive_summary": "3-4 Sätze Kernaussage",
            "key_insights": ["insight1", "insight2", "insight3"],
            "surprising_fact": "Das überraschendste Finding",
            "main_thesis": "Die zentrale These für den Artikel",
            "content_angle": "Empfohlener Blickwinkel/Framing",
            "must_mention": ["Punkt1", "Punkt2", "Punkt3"],
            "avoid": ["Was man vermeiden sollte"],
            "hook_ideas": ["Möglicher Einstieg 1", "Möglicher Einstieg 2"],
            "seo_keywords": "keyword1, keyword2, keyword3, keyword4, keyword5"
          }}
        expected_output: >
          JSON-Briefing-Dokument mit Summary, Insights, These, Angle,
          Must-Mentions, Avoids, Hook-Ideen und SEO-Keywords.
        context_task_ids:
          - deep_research

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Multichannel-Fabrik Crew ─────────────────────────────────────────────────
  # Nimmt ein Thema und bricht es in ALLE Formate auf
  # Inputs: topic, category, source_article (optional – vorhandener Blogartikel)
  multichannel_fabrik_crew:
    name: "Multichannel-Fabrik Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: strategist
        role: "Content Strategist"
        goal: >
          Analysiere das Thema und entwickle eine plattformspezifische
          Content-Strategie. Entscheide welche Kernbotschaft für jeden
          Kanal am wirkungsvollsten ist und welche Hooks funktionieren.
        backstory: >
          Du bist ein Content-Stratege der multi-channel Kampagnen plant.
          Du weißt genau was auf Twitter viral geht, was LinkedIn-Profis
          überzeugt und welche Video-Hooks auf TikTok/YouTube Shorts
          funktionieren. Du denkst in Content-Systemen, nicht in Einzelstücken.
        mcp_servers: []

      - id: writer
        role: "Content Writer & SEO Specialist"
        goal: >
          Schreibe den Kernartikel in Blogpost-Qualität und leite daraus
          alle weiteren Content-Formate ab. Maximale Wiederverwendung
          des Research-Materials bei optimaler Plattform-Anpassung.
        backstory: >
          Du bist ein Profi-Texter der mühelos zwischen Formaten wechselt.
          Du schreibst fesselnde Blogartikel genauso gut wie knackige
          Tweets oder LinkedIn-Posts. Dein Output ist immer direkt
          verwendbar, ohne Nachbearbeitung.
        mcp_servers: []

      - id: viral_scout
        role: "Viral Content Scout"
        goal: >
          Mache aus jedem Stück Content das Viralpotenzial sichtbar.
          Schreibe 5 Tweets-Variationen mit Hooks, erstelle Video-Skripte
          mit Cliffhanger-Einstiegen und identifiziere die eine überraschende
          Perspektive die Menschen teilen müssen.
        backstory: >
          Du bist ein Social-Media-Native der auf ein starkes
          Viralpotenzial-Gespür hat. Du weißt welche Sätze als Tweets
          explodierten, welche Thumbnails geklickt werden und wie man
          aus einem Blogpost 10x mehr Reichweite herausholt.
          Du lebst für Engagement-Metriken.
        mcp_servers: []

    tasks:
      - id: strategy
        agent_id: strategist
        description: >
          Entwickle die Multi-Channel-Strategie für "{topic}" (Kategorie: {category}).

          Plane für folgende Kanäle:
          - Blog (Hauptartikel ~800 Wörter)
          - Twitter/X (5 Tweets für Thread + 1 Standalone-Tweet)
          - LinkedIn (1 langer Post ~300 Wörter)
          - Short-Video (3 Skripte á 60 Sek für TikTok/Reels/Shorts)

          Liefere für jeden Kanal:
          1. Kernbotschaft (1 Satz)
          2. Primären Hook (Einstieg)
          3. Call-to-Action
          4. Optimaler Veröffentlichungszeitpunkt (Wochentag + Uhrzeit)
        expected_output: >
          Multi-Channel-Strategie mit Kernbotschaft, Hook und CTA pro Kanal,
          plus Veröffentlichungsplan.

      - id: main_content
        agent_id: writer
        description: >
          Erstelle den vollständigen Multi-Channel-Content-Mix für "{topic}".

          Basierend auf der Content-Strategie, liefere als JSON:
          {{
            "blog_article": {{
              "title": "...", "excerpt": "...", "content": "...(Markdown, 700-900 Wörter)",
              "seo_keywords": "...", "publish_at": "Wochentag HH:MM"
            }},
            "linkedin_post": {{
              "text": "...(max 3000 Zeichen, mit Emojis, Absätzen)", "hashtags": ["...", "..."],
              "publish_at": "..."
            }},
            "tweet_thread": {{
              "tweets": ["Tweet 1/5...", "Tweet 2/5...", "Tweet 3/5...", "Tweet 4/5...", "Tweet 5/5..."],
              "standalone": "Ein einzelner hochperformanter Tweet ohne Thread-Kontext",
              "publish_at": "..."
            }}
          }}
        expected_output: >
          JSON mit blog_article, linkedin_post und tweet_thread.
        context_task_ids:
          - strategy

      - id: video_scripts
        agent_id: viral_scout
        description: >
          Schreibe 3 kurze Video-Skripte (je ~60 Sekunden, ~150 Wörter) für "{topic}".

          Jedes Skript braucht:
          - Hook (erste 3 Sek, macht neugierig)
          - Cliffhanger nach 15 Sek ("Aber dann kam das Überraschende...")
          - Kernaussage (30-45 Sek)
          - Call-to-Action (letzte 10 Sek)

          Format:
          [
            {{
              "title": "Video-Titel (max 50Z)",
              "hook": "...",
              "body": "...",
              "cta": "...",
              "thumbnail_idea": "Beschreibung eines klickbaren Thumbnails",
              "platform": "TikTok|Reels|Shorts"
            }}
          ]
        expected_output: >
          JSON-Array mit 3 Video-Skripten für verschiedene Plattformen.
        context_task_ids:
          - strategy
          - main_content

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Red Team Crew (Qualitätssicherung) ───────────────────────────────────────
  # Erhält fertigen Content und prüft ihn schonungslos
  # Inputs: content (zu prüfender Text), topic, category
  red_team_crew:
    name: "Red Team Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: fact_checker
        role: "Fact Checker & Research Validator"
        model: "openrouter/deepseek/deepseek-r1"  # Reasoning-Stärke für Faktenprüfung
        goal: >
          Prüfe jeden Fakt, jede Statistik und jede Behauptung im Content.
          Identifiziere ungeprüfte Aussagen, veraltete Informationen und
          potenzielle Fehler. Sei rigoros und kompromisslos.
        backstory: >
          Du bist ein journalistischer Faktenprüfer mit wissenschaftlichem
          Anspruch. Du kennst die häufigsten KI-Mythen und verbreiteten
          Fehlinformationen im Tech-Raum. Du prüfst alles und lässt
          nichts durchgehen – das ist dein Stolz.
        mcp_servers: []

      - id: resonance_checker
        role: "Audience Resonance Analyst"
        goal: >
          Bewerte den Content aus der Perspektive der Zielgruppe.
          Prüfe ob die Sprache passt, ob der Mehrwert klar ist und
          ob der Text wirklich begeistert oder nur informiert.
          Antizipiere die Reaktionen der Leser.
        backstory: >
          Du bist ein erfahrener UX-Writer und Conversion-Optimierer.
          Du liest Content aus den Augen des Nutzers und weißt sofort
          ob er am Punkt vorbeigeht. Du hast hunderte Texte A/B-getestet
          und erkennst sofort was gut und was schwach ist.
        mcp_servers: []

      - id: speed_reviewer
        role: "Speed Review Specialist"
        goal: >
          Fasse alle Kritikpunkte zusammen und erstelle einen
          priorisierten Verbesserungsplan. Unterscheide zwischen
          Must-Fix (blockiert Veröffentlichung) und Nice-to-Have.
          Liefere konkrete Reformulierungsvorschläge.
        backstory: >
          Du bist Llama-H, der schnellste Reviewer im Team.
          Du fasst komplexe Feedback-Ströme blitzschnell zusammen
          und destillierst sie in umsetzbare Action-Items.
          Kein langes Drumherumreden – nur was zählt.
        mcp_servers: []

    tasks:
      - id: fact_check
        agent_id: fact_checker
        description: >
          Führe ein vollständiges Fact-Check des folgenden Contents durch.
          Thema: "{topic}" | Kategorie: "{category}"

          ZU PRÜFENDER CONTENT:
          {content}

          Prüfe:
          1. Alle konkreten Zahlen und Statistiken (Quelle? Aktuell?)
          2. Alle Behauptungen über KI-Modelle/Unternehmen (korrekt?)
          3. Alle Vergleiche und Rankings (stimmt die Reihenfolge?)
          4. Veraltete Informationen (post-2024 relevant?)
          5. Übertreibungen oder Clickbait-Behauptungen

          Format: Liste aller gefundenen Probleme mit Schweregrad (KRITISCH/MITTEL/GERING)
          und Korrekturvorschlag.
        expected_output: >
          Fact-Check-Report: Liste aller Befunde nach Schweregrad,
          mit Korrekturvorschlägen. Falls alles korrekt: "FACT-CHECK BESTANDEN".

      - id: resonance_check
        agent_id: resonance_checker
        description: >
          Analysiere den Content auf Zielgruppen-Resonanz.
          Thema: "{topic}"

          CONTENT:
          {content}

          Bewerte (Skala 1-10):
          - Klarheit der Kernaussage
          - Mehrwert für die Zielgruppe (DACH-KI-Community)
          - Emotionale Ansprache / Engagement-Potential
          - Lesbarkeit und Flow
          - Stärke des Hooks / Einstiegs
          - Überzeugungskraft des CTAs

          Identifiziere die 3 schwächsten Stellen und schlage
          konkrete Alternativen vor.
        expected_output: >
          Resonanz-Score (Gesamtwert 1-10), Scores pro Dimension,
          Top 3 Schwachstellen mit konkreten Verbesserungsvorschlägen.

      - id: quality_verdict
        agent_id: speed_reviewer
        description: >
          Erstelle das finale Qualitäts-Urteil für "{topic}"-Content.

          Konsolidiere Fact-Check und Resonanz-Analyse:

          Liefere JSON:
          {{
            "overall_score": 7.5,
            "publish_decision": "PUBLISH|REVISE|REJECT",
            "must_fix": [
              {{"issue": "...", "fix": "...", "priority": "KRITISCH"}}
            ],
            "nice_to_have": [
              {{"issue": "...", "fix": "..."}}
            ],
            "strengths": ["Was ist richtig gut", "..."],
            "estimated_revision_time": "5 Minuten|30 Minuten|2 Stunden",
            "final_verdict": "Kurze Zusammenfassung in 2-3 Sätzen"
          }}
        expected_output: >
          JSON Qualitäts-Urteil mit Score, Publish-Entscheidung,
          Must-Fix-Liste, Stärken und Zeitschätzung für Überarbeitung.
        context_task_ids:
          - fact_check
          - resonance_check

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Market Intelligence Crew ──────────────────────────────────────────────────
  # Scoutet proaktiv Chancen und erstellt tägliche Themen-Vorschläge
  # Inputs: news_summary, date_today, niche (default: "KI/Automation DACH")
  market_intelligence_crew:
    name: "Market Intelligence Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: trend_scout
        role: "Trend Intelligence Analyst"
        goal: >
          Scanne News und Entwicklungen im KI-Bereich und identifiziere
          Signale für aufkommende Themen. Erkenne was heute relevant ist
          und was morgen explodiert. Bewerte Nachrichten nach Content-Potenzial.
        backstory: >
          Du bist Tiefsee-Suche, ein KI-Analyst der täglich Hunderte
          von Quellen auswertet. Du erkennst Trends bevor sie Mainstream
          werden und weißt welche News die DACH-KI-Community bewegen wird.
          Dein Radar für viral-würdige Themen ist unübertroffen.
        mcp_servers: []

      - id: opportunity_evaluator
        role: "Content Opportunity Evaluator"
        goal: >
          Filtere und priorisiere die identifizierten Themen nach
          Content-Potential, Timing und strategischem Fit.
          Entscheide welche Chancen sofort genutzt werden müssen.
        backstory: >
          Du bist X-Agent Alpha, der schnellste Bewerter im System.
          Du analysierst blitzschnell ob ein Thema es wert ist,
          Content-Ressourcen zu investieren. Deine Empfehlungen sind
          klar, datenbasiert und umsetzbar. Kein Thema geht unbewertet durch.
        mcp_servers: []

      - id: briefing_creator
        role: "Morning Briefing Creator"
        goal: >
          Synthetisiere alle Intelligence zu einem handlungsorientierten
          Morning Briefing. Erstelle sofort nutzbare Content-Vorschläge
          die das Team direkt in Produktion geben kann.
        backstory: >
          Du bist Gemini-U, der Innovator im Team. Du verwandelst rohe
          Marktdaten in elegante, umsetzbare Briefings. Dein Output
          ist der erste Schritt jedes erfolgreichen Content-Tages –
          kompakt, klar und sofort handlungsfähig.
        mcp_servers: []

    tasks:
      - id: news_scan
        agent_id: trend_scout
        description: >
          Analysiere die folgenden News und Entwicklungen vom {date_today}
          auf Content-Potential für die Nische: {niche}

          NEWS-ZUSAMMENFASSUNG:
          {news_summary}

          Identifiziere:
          1. Top 5 Themen mit hohem Content-Potential (Warum gerade jetzt?)
          2. Themen die in 24-48h ihren Peak haben werden (JETZT handeln!)
          3. Kontroverses oder Überraschendes das Diskussionen auslöst
          4. Evergreen-Winkel auf aktuelle News (langfristige Relevanz)
          5. Competitor-Moves die eine Reaktion erfordern

          Bewerte jedes Thema: Viralpotenzial (1-10) + Timing-Fenster.
        expected_output: >
          Intelligence-Report: Top 5 Themen mit Begründung, Viralpotenzial-Score
          und Timing-Empfehlung.

      - id: opportunity_scoring
        agent_id: opportunity_evaluator
        description: >
          Bewerte und priorisiere die identifizierten Themen für {niche}.

          Erstelle eine Prioritätsliste:
          - SOFORT produzieren (Timing-Window schließt sich)
          - Diese Woche produzieren (gutes Potenzial, nicht zeitkritisch)
          - Beobachten (könnte noch größer werden)
          - Skip (nicht relevant für unsere Nische)

          Für jedes SOFORT-Thema: Welches Format empfiehlst du?
          (Blog / Twitter-Thread / LinkedIn / Video-Skript)
        expected_output: >
          Priorisierte Themenliste mit Status (Sofort/Woche/Beobachten/Skip)
          und Format-Empfehlung für alle SOFORT-Themen.
        context_task_ids:
          - news_scan

      - id: morning_briefing
        agent_id: briefing_creator
        description: >
          Erstelle das Morning Briefing für {date_today}.

          JSON-Output:
          {{
            "briefing_date": "{date_today}",
            "niche": "{niche}",
            "executive_summary": "2-3 Sätze: Was ist heute los in unserer Nische?",
            "top_opportunities": [
              {{
                "rank": 1,
                "topic": "Konkretes Thema",
                "why_now": "Timing-Begründung (1 Satz)",
                "recommended_format": "Blog|Twitter|LinkedIn|Video",
                "hook_idea": "Einstieg-Idee für den Content",
                "estimated_effort": "30min|2h|Halbtag",
                "viralpotential_score": 8
              }}
            ],
            "watch_list": ["Thema das noch größer werden könnte", "..."],
            "skip_today": ["Was wir heute ignorieren"],
            "ready_to_produce": "Bestes SOFORT-Thema mit Begründung"
          }}

          Maximal 5 Top-Opportunities, fokussiert und umsetzbar.
        expected_output: >
          JSON Morning Briefing mit Executive Summary, Top 5 Opportunities,
          Watch-List und Ready-to-Produce-Empfehlung.
        context_task_ids:
          - news_scan
          - opportunity_scoring

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Director Agent (Crew-Router) ──────────────────────────────────────────────
  # Analysiert einen User-Prompt und entscheidet welche Crew zuständig ist
  # Inputs: user_prompt, available_crews (optional)
  director_crew:
    name: "Director Agent"
    model: "gemini-2.5-flash"
    agents:
      - id: director
        role: "Director Agent & Crew Router"
        goal: >
          Analysiere User-Anfragen und entscheide welche Crew und welche Inputs
          am besten geeignet sind. Spare Token indem du nur den relevanten
          Workflow aktivierst. Du bist der Dirigent des gesamten Systems.
        backstory: >
          Du bist der Director – der übergeordnete Agent der keine eigenen
          Tasks erledigt, sondern das gesamte AIOS-System orchestriert.
          Du kennst jede Crew, ihre Stärken und wann man sie einsetzt.
          Deine Entscheidungen sind blitzschnell und präzise.
          Fehler beim Routing kosten Zeit und Token – das akzeptierst du nicht.
        mcp_servers: []

    tasks:
      - id: route
        agent_id: director
        description: >
          Analysiere folgenden User-Prompt und entscheide das optimale Routing.

          USER PROMPT: "{user_prompt}"

          VERFÜGBARE CREWS:
          - content_generation_crew: Schreibt Blogartikel zu einem Thema
          - niche_analysis_crew: Analysiert Zielgruppen und bewertet Content-Chancen
          - content_forecast_crew: Erstellt Content-Kalender aus Trend-Daten
          - deep_research_crew: Tiefe Recherche zu einem Thema
          - quick_research_crew: Schnelle Analyse, ideal für Tests
          - multichannel_fabrik_crew: Blog + Tweets + LinkedIn + Video aus einem Thema
          - red_team_crew: Prüft vorhandenen Content auf Fakten und Qualität
          - market_intelligence_crew: Scoutet News und erstellt Morning Briefing
          - director_crew: Dieser Routing-Agent selbst (nicht recurse!)

          Liefere JSON:
          {{
            "recommended_crew": "crew_id",
            "confidence": 0.95,
            "reasoning": "Warum diese Crew am besten passt (1-2 Sätze)",
            "suggested_inputs": {{
              "topic": "...",
              "category": "...",
              "target_platforms": "..."
            }},
            "alternatives": [
              {{
                "crew": "crew_id",
                "reason": "Wäre auch möglich weil..."
              }}
            ],
            "estimated_tokens": "niedrig|mittel|hoch",
            "estimated_runtime": "30s|2min|5min"
          }}
        expected_output: >
          JSON Routing-Entscheidung mit empfohlener Crew, Confidence-Score,
          Begründung, vorbereiteten Inputs und Alternativen.

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── Quick Research Crew (leichtgewichtig, für Tests) ─────────────────────────
  quick_research_crew:
    name: "Quick Research Crew"
    model: "gemini-2.5-flash"
    agents:
      - id: analyst
        role: "Research Analyst"
        goal: "Analysiere das Thema und liefere eine prägnante Zusammenfassung."
        backstory: >
          Du bist ein schneller, präziser Analyst der komplexe Themen in wenigen
          Sätzen auf den Punkt bringt. Du schreibst auf Deutsch.
        mcp_servers: []

    tasks:
      - id: analyze
        agent_id: analyst
        description: >
          Analysiere das Thema "{topic}" kurz und prägnant.
          Liefere: 3 Kernpunkte, 3 relevante Keywords, eine Handlungsempfehlung.
        expected_output: >
          Strukturierte Analyse mit Kernpunkten, Keywords und Empfehlung.

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""

  # ── xAI Social Crew ──────────────────────────────────────────────────────────
  # Grok-3 via OpenRouter — nativ für X/Twitter-Kultur trainiert
  # Inputs: topic, category, target_platforms (twitter,linkedin,threads)
  xai_social_crew:
    name: "xAI Social Crew"
    model: "openrouter/x-ai/grok-3"
    agents:
      - id: trend_hook
        role: "Viral Trend Analyst"
        goal: >
          Analysiere das Thema auf virales Potenzial für X/Twitter.
          Identifiziere den perfekten Hook, aktuelle Diskussionen und
          relevante Hashtags. Denke in Memes, Threads und Engagement.
        backstory: >
          Du bist tief in der X/Twitter-Community verwurzelt. Du verstehst
          die Plattform-Kultur, weißt was Threads viral gehen lässt und
          erkennst sofort ob ein Hook zündet oder floppt. Du hast
          Hunderttausende Follower-Wachstum analysiert.
        mcp_servers: []

      - id: tweet_writer
        role: "Twitter/X Copywriter"
        goal: >
          Erstelle einen vollständigen X-Thread mit 5-8 Tweets plus
          einen LinkedIn-Post und 3 Hook-Varianten für A/B-Tests.
          Maximale Reichweite, echte Mehrwert-Vermittlung.
        backstory: >
          Du schreibst X-Threads die performen. Dein Stil ist direkt,
          pointiert und immer nah an dem was die Community gerade bewegt.
          Du kennst den Unterschied zwischen informativem Thread und
          purem Engagement-Bait — und findest den Sweet Spot dazwischen.
        mcp_servers: []

      - id: platform_adapter
        role: "Multi-Platform Content Adapter"
        goal: >
          Adaptiere den X-Thread für LinkedIn (professioneller Ton),
          Instagram (visuell, Carousel-Text) und Threads (lockererer Stil).
          Jede Plattform bekommt ihren eigenen Charakter — kein Copy-Paste.
        backstory: >
          Du bist Plattform-Spezialist und kennst die Erwartungen der
          Nutzer auf jeder Plattform genau. Was auf X zündet kann auf
          LinkedIn peinlich wirken. Du übersetzt Content-Substanz in
          plattformgerechte Sprache.
        mcp_servers: []

    tasks:
      - id: trend_analysis
        agent_id: trend_hook
        description: >
          Analysiere "{topic}" für X/Twitter und soziale Plattformen.
          Kategorie: {category}.
          Liefere: virales Potenzial (1-10), 3 Hook-Optionen, 5 relevante
          Hashtags, aktuelle Diskussionswinkel und was die Community
          gerade dazu sagt oder sagen würde.
        expected_output: >
          Trend-Analyse mit Viral-Score, 3 Hook-Varianten, Hashtag-Liste
          und Community-Kontext.

      - id: twitter_thread
        agent_id: tweet_writer
        context_task_ids: [trend_analysis]
        description: >
          Erstelle basierend auf der Trend-Analyse einen X-Thread zu "{topic}".
          Format:
          - Tweet 1: Hook (max 280 Zeichen, stoppt den Scroll)
          - Tweets 2-7: Kerninhalt, jeder Tweet standalone wertvoll
          - Tweet 8: CTA + Zusammenfassung
          - 3 Hook-Varianten zum A/B-Testen
          Sprache: Deutsch, authentisch, kein Corporate-Speak.
        expected_output: >
          Vollständiger X-Thread (8 Tweets) + 3 Hook-Varianten als JSON:
          {"thread": ["tweet1", ...], "hooks": ["v1", "v2", "v3"]}

      - id: platform_versions
        agent_id: platform_adapter
        context_task_ids: [trend_analysis, twitter_thread]
        description: >
          Adaptiere den Thread für:
          1. LinkedIn: professioneller Ton, 1200-1500 Zeichen, Insights betonen
          2. Instagram Carousel: 6-8 Slides als Text-Snippets, visuell denkend
          3. Threads: lockererer Stil, 3-5 kurze Posts
          Plattformen laut Ziel: {target_platforms}
        expected_output: >
          JSON mit allen Plattform-Versionen:
          {"linkedin": "...", "instagram_carousel": ["slide1", ...],
           "threads": ["post1", ...], "x_thread": ["tweet1", ...]}

    process: sequential
    webhooks:
      on_start: ""
      on_complete: ""
