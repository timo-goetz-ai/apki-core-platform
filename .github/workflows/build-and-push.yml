name: Build & Push – Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
  workflow_dispatch:
    inputs:
      service:
        description: "Welcher Service?"
        required: true
        default: "all"
        type: choice
        options: [all, nexus-core, admin-dashboard, crew-api, landing-page, telegram-bot]

env:
  REGISTRY: ghcr.io
  OWNER: timogoetz1988

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      nexus-core: ${{ steps.filter.outputs.nexus-core }}
      admin-dashboard: ${{ steps.filter.outputs.admin-dashboard }}
      crew-api: ${{ steps.filter.outputs.crew-api }}
      landing-page: ${{ steps.filter.outputs.landing-page }}
      telegram-bot: ${{ steps.filter.outputs.telegram-bot }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nexus-core:
              - 'services/nexus-core/**'
            admin-dashboard:
              - 'services/admin-dashboard/**'
            crew-api:
              - 'services/crew-api/**'
            landing-page:
              - 'services/landing-page/**'
            telegram-bot:
              - 'services/telegram-bot/**'

  build-nexus-core:
    name: Build nexus-core
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.nexus-core == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'nexus-core'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-core
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/nexus-core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-dashboard:
    name: Build admin-dashboard
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.admin-dashboard == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'admin-dashboard'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/aios-admin-dashboard
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/admin-dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_AIOS_CORE_API_URL=https://api.aios.automation-plus-ki.de
            NEXT_PUBLIC_WS_URL=wss://api.aios.automation-plus-ki.de
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-crew-api:
    name: Build crew-api
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.crew-api == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'crew-api'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/crew-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/crew-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-landing-page:
    name: Build landing-page
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.landing-page == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'landing-page'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/aios-landing-page
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/landing-page
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-telegram-bot:
    name: Build telegram-bot
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.telegram-bot == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'telegram-bot'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/telegram-bot
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/telegram-bot
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
