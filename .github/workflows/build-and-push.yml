name: Build & Push – Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
  workflow_dispatch:
    inputs:
      service:
        description: "Welcher Service?"
        required: true
        default: "all"
        type: choice
        options: [all, nexus-core, admin-dashboard, crew-api]

env:
  REGISTRY: ghcr.io
  OWNER: timo-goetz-ai

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      nexus-core: ${{ steps.filter.outputs.nexus-core }}
      admin-dashboard: ${{ steps.filter.outputs.admin-dashboard }}
      crew-api: ${{ steps.filter.outputs.crew-api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nexus-core:
              - 'services/nexus-core/**'
            admin-dashboard:
              - 'services/admin-dashboard/**'
            crew-api:
              - 'services/crew-api/**'

  build-nexus-core:
    name: Build nexus-core
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.nexus-core == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'nexus-core'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-core
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/nexus-core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-dashboard:
    name: Build admin-dashboard
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.admin-dashboard == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'admin-dashboard'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-admin-dashboard
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/admin-dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_AIOS_CORE_API_URL=https://api.aios.automation-plus-ki.de
            NEXT_PUBLIC_WS_URL=wss://api.aios.automation-plus-ki.de
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy admin-dashboard via Coolify
        continue-on-error: true
        env:
          COOLIFY_URL:            ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN:          ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DASHBOARD_UUID: ${{ secrets.COOLIFY_DASHBOARD_UUID }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${COOLIFY_URL}/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${COOLIFY_DASHBOARD_UUID}\", \"force\": true}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Coolify Deploy Response: $BODY (HTTP $HTTP_CODE)"
          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
            echo "⚠️ Coolify Deploy fehlgeschlagen (HTTP $HTTP_CODE) — Image wurde trotzdem gepusht"
          else
            echo "✅ Coolify Deploy ausgelöst"
          fi

  build-crew-api:
    name: Build crew-api
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.crew-api == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == 'all' || github.event.inputs.service == 'crew-api'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-crew-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: services/crew-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

