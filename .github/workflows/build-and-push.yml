name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: timogoetz1988

jobs:
  nexus-core:
    name: Build nexus-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/nexus-core
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/nexus-core:latest
            ghcr.io/${{ env.OWNER }}/nexus-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  admin-dashboard:
    name: Build admin-dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-dashboard
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/aios-admin-dashboard:latest
            ghcr.io/${{ env.OWNER }}/aios-admin-dashboard:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_NEXUS_API_URL=https://api.aios.automation-plus-ki.de
            NEXT_PUBLIC_WS_URL=wss://api.aios.automation-plus-ki.de
          cache-from: type=gha
          cache-to: type=gha,mode=max
