name: CI – Lint, Test & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, staging]

env:
  REGISTRY: ghcr.io
  OWNER: timogoetz1988

jobs:
  # ──────────────────────────────────────────────
  # Python: nexus-core + crew-api + agents
  # ──────────────────────────────────────────────
  python-lint-test:
    name: Python – Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        service: [services/nexus-core, services/crew-api, agents/coder-agent]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: ruff check . --output-format=github

      - name: Tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "Keine Tests gefunden – überspringe"
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test_db
          REDIS_URL: redis://localhost:6379/0
          OPENROUTER_API_KEY: test_key
          JWT_SECRET: test_secret_min_32_chars_placeholder

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

  # ──────────────────────────────────────────────
  # Node: admin-dashboard
  # ──────────────────────────────────────────────
  node-lint-test:
    name: Node – Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: services/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: services/admin-dashboard
        run: npm ci

      - name: Lint (eslint)
        working-directory: services/admin-dashboard
        run: npm run lint

      - name: Build
        working-directory: services/admin-dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_NEXUS_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ──────────────────────────────────────────────
  # Docker Build Check (kein Push)
  # ──────────────────────────────────────────────
  docker-build-check:
    name: Docker – Build Validation
    runs-on: ubuntu-latest
    needs: [python-lint-test, node-lint-test]
    strategy:
      matrix:
        include:
          - context: services/nexus-core
            image: nexus-core
          - context: services/admin-dashboard
            image: aios-admin-dashboard
          - context: agents/coder-agent
            image: coder-agent

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
