name: CI – Lint, Test & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: timogoetz1988

jobs:
  # ──────────────────────────────────────────────
  # Python: aios-core + crew-api + agents
  # ──────────────────────────────────────────────
  python-lint-test:
    name: Python – Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        service: [services/nexus-core, services/crew-api]

    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        continue-on-error: true
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENROUTER_API_KEY: op://fwl7qdu7q3nvqqjbrljzcdhita/AI-APIs/openrouter_api_key
          ANTHROPIC_API_KEY: op://fwl7qdu7q3nvqqjbrljzcdhita/AI-APIs/anthropic_api_key
          OPENAI_API_KEY: op://fwl7qdu7q3nvqqjbrljzcdhita/AI-APIs/openai_api_key
          JWT_SECRET: op://fwl7qdu7q3nvqqjbrljzcdhita/Core/jwt_secret

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Security audit (pip-audit)
        working-directory: ${{ matrix.service }}
        run: |
          pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt --skip-editable || true; fi

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: ruff check . --output-format=github

      - name: Tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "Keine Tests gefunden – überspringe"
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test_db
          REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

  # ──────────────────────────────────────────────
  # Node: admin-dashboard
  # ──────────────────────────────────────────────
  node-lint-test:
    name: Node – Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        continue-on-error: true
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NOCODB_URL: op://fwl7qdu7q3nvqqjbrljzcdhita/NocoDB/url
          NOCODB_API_KEY: op://fwl7qdu7q3nvqqjbrljzcdhita/NocoDB/api_key
          NOCODB_MCP_PROJEKTE_TABLE_ID: op://fwl7qdu7q3nvqqjbrljzcdhita/NocoDB/mcp_projekte_table_id
          NOCODB_MCP_DIENSTE_TABLE_ID: op://fwl7qdu7q3nvqqjbrljzcdhita/NocoDB/mcp_dienste_table_id
          COOLIFY_URL: op://fwl7qdu7q3nvqqjbrljzcdhita/Coolify/url
          COOLIFY_TOKEN: op://fwl7qdu7q3nvqqjbrljzcdhita/Coolify/token
          COOLIFY_API_KEY: op://fwl7qdu7q3nvqqjbrljzcdhita/Coolify/token
          CLOUDFLARE_API_TOKEN: op://fwl7qdu7q3nvqqjbrljzcdhita/Cloudflare-API/api_token
          DASHBOARD_API_KEY: op://fwl7qdu7q3nvqqjbrljzcdhita/Core/dashboard_api_key

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: services/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: services/admin-dashboard
        run: npm install --legacy-peer-deps

      - name: Security audit (npm)
        working-directory: services/admin-dashboard
        run: npm audit --audit-level=high || true

      - name: Lint (eslint)
        working-directory: services/admin-dashboard
        run: npm run lint

      - name: Build
        working-directory: services/admin-dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_AIOS_CORE_API_URL: https://api.aios.automation-plus-ki.de
          NEXT_PUBLIC_WS_URL: wss://api.aios.automation-plus-ki.de

  # ──────────────────────────────────────────────
  # Docker Build Check (kein Push)
  # ──────────────────────────────────────────────
  docker-build-check:
    name: Docker – Build Validation
    runs-on: ubuntu-latest
    needs: [python-lint-test, node-lint-test]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - context: services/nexus-core
            image: nexus-core
          - context: services/admin-dashboard
            image: aios-admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy – Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:test
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
