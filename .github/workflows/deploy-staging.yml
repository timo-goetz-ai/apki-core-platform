name: Deploy – Staging (Hetzner)

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: timogoetz1988

jobs:
  # ──────────────────────────────────────────────
  # Build Images für Staging
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Staging Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push nexus-core (staging tag)
        uses: docker/build-push-action@v5
        with:
          context: services/nexus-core
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-core:staging
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-core:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push admin-dashboard (staging tag)
        uses: docker/build-push-action@v5
        with:
          context: services/admin-dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/aios-admin-dashboard:staging
          build-args: |
            NEXT_PUBLIC_NEXUS_API_URL=https://api.staging.aios.automation-plus-ki.de
            NEXT_PUBLIC_WS_URL=wss://api.staging.aios.automation-plus-ki.de
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # DB Migration (Staging)
  # ──────────────────────────────────────────────
  db-migration:
    name: Database Migration (Staging)
    runs-on: ubuntu-latest
    needs: [build]
    environment: staging

    steps:
      - name: DB Migration via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aios-staging
            docker exec aios-staging-nexus-core alembic upgrade head
            echo "Staging Migration erfolgreich"

  # ──────────────────────────────────────────────
  # Deploy via Coolify
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy zu Hetzner Staging
    runs-on: ubuntu-latest
    needs: [db-migration]
    environment: staging

    steps:
      - name: Deploy nexus-core (staging)
        run: |
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "${{ secrets.COOLIFY_STAGING_NEXUS_UUID }}", "force": true}'

      - name: Deploy admin-dashboard (staging)
        run: |
          curl -X POST "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "${{ secrets.COOLIFY_STAGING_DASHBOARD_UUID }}", "force": true}'

      - name: Warte auf Deploy (60s)
        run: sleep 60

  # ──────────────────────────────────────────────
  # Smoke Tests
  # ──────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - uses: actions/checkout@v4

      - name: Health Check – nexus-core
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.staging.aios.automation-plus-ki.de/health)
            if [[ "$STATUS" == "200" ]]; then
              echo "✓ nexus-core staging: HTTP 200"
              break
            fi
            echo "Versuch $i/5 (HTTP $STATUS) – warte 15s..."
            sleep 15
          done
          [[ "$STATUS" == "200" ]] || (echo "Staging Health Check fehlgeschlagen!" && exit 1)

      - name: API Smoke Tests
        run: |
          # Einfache API-Checks
          curl -f https://api.staging.aios.automation-plus-ki.de/api/v1/health \
            -H "Content-Type: application/json" || exit 1
          echo "✓ API Smoke Tests bestanden"

      - name: Dashboard Check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://app.staging.aios.automation-plus-ki.de)
          [[ "$STATUS" == "200" ]] && echo "✓ Dashboard: OK" || \
            (echo "Dashboard nicht erreichbar: HTTP $STATUS" && exit 1)

  # ──────────────────────────────────────────────
  # Benachrichtigung
  # ──────────────────────────────────────────────
  notify:
    name: Staging Notification
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()

    steps:
      - name: Slack Notification
        run: |
          STATUS="${{ needs.smoke-tests.result }}"
          if [[ "$STATUS" == "success" ]]; then
            ICON="✅"; MSG="Staging Deploy erfolgreich"
          else
            ICON="❌"; MSG="Staging Deploy FEHLGESCHLAGEN"
          fi
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$ICON AIOS Staging: $MSG\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\"}"
